substitutions:
  _REGION: us-central1
  _SERVICE: counterstep
  _REPOSITORY: counterstep
  _SERVICE_ACCOUNT: counterstep-runtime
  _GEMINI_SECRET_VERSION: "1"

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=COUNTERSTEP_AGENT_MODE=gemini,COUNTERSTEP_REPOSITORY=firestore,COUNTERSTEP_GEMINI_MODEL=gemini-3.5-flash-lite,COUNTERSTEP_AGENT_TIMEOUT_MS=30000,COUNTERSTEP_MAX_DAILY_RUNS=200,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=(default)
      - --set-secrets=GEMINI_API_KEY=counterstep-gemini-api-key:${_GEMINI_SECRET_VERSION}
      - --memory=512Mi
      - --cpu=1
      - --timeout=60
      - --concurrency=1
      - --min-instances=0
      - --max-instances=1

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
