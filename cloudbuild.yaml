substitutions:
  _REGION: us-central1
  _SERVICE: counterstep
  _REPOSITORY: counterstep
  _BUILD_SERVICE_ACCOUNT: counterstep-build
  _SERVICE_ACCOUNT: counterstep-runtime

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=COUNTERSTEP_AGENT_MODE=fixture,COUNTERSTEP_REPOSITORY=memory,COUNTERSTEP_MAX_DAILY_RUNS=10
      - --remove-secrets=GEMINI_API_KEY
      - --memory=512Mi
      - --cpu=1
      - --cpu-throttling
      - --no-cpu-boost
      - --timeout=30
      - --concurrency=1
      - --no-session-affinity
      - --min=0
      - --max=1
      - --min-instances=0
      - --max-instances=1

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

serviceAccount: projects/$PROJECT_ID/serviceAccounts/${_BUILD_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
